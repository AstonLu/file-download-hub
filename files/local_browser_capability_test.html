<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Browser Capability Test</title>
  <style>
    body { font-family: Arial, "Microsoft JhengHei", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    .card { border: 1px solid #d0d7de; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    button { padding: 10px 16px; margin: 6px 8px 6px 0; cursor: pointer; }
    .ok { color: #137333; font-weight: 700; }
    .fail { color: #b3261e; font-weight: 700; }
    code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>本地 HTML / JavaScript 能力測試</h1>

  <div class="card">
    <h2>1. JavaScript 測試</h2>
    <button id="jsTest">執行 JavaScript</button>
    <div id="jsResult">尚未測試</div>
  </div>

  <div class="card">
    <h2>2. 本機檔案讀取測試</h2>
    <input id="fileInput" type="file" />
    <div id="fileResult">尚未選擇檔案</div>
  </div>

  <div class="card">
    <h2>3. 產生並下載檔案測試</h2>
    <button id="downloadTest">下載測試檔案</button>
    <div id="downloadResult">尚未測試</div>
  </div>

  <div class="card">
    <h2>判讀方式</h2>
    <p>三項都成功，代表可開發第一版純前端 PDF 工具。</p>
    <p>此頁面不連網、不上傳任何檔案，也不使用外部套件。</p>
  </div>

  <script>
    const jsResult = document.getElementById('jsResult');
    const fileResult = document.getElementById('fileResult');
    const downloadResult = document.getElementById('downloadResult');

    document.getElementById('jsTest').addEventListener('click', () => {
      jsResult.textContent = '成功：瀏覽器允許執行本地 JavaScript';
      jsResult.className = 'ok';
    });

    document.getElementById('fileInput').addEventListener('change', async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const buffer = await file.arrayBuffer();
        fileResult.textContent = `成功：已讀取 ${file.name}，大小 ${buffer.byteLength.toLocaleString()} bytes`;
        fileResult.className = 'ok';
      } catch (error) {
        fileResult.textContent = `失敗：${error.message}`;
        fileResult.className = 'fail';
      }
    });

    document.getElementById('downloadTest').addEventListener('click', () => {
      try {
        const content = [
          'Local browser capability test',
          `Generated at: ${new Date().toLocaleString()}`,
          'JavaScript and Blob download are working.'
        ].join('\n');

        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'local-browser-test-result.txt';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);

        downloadResult.textContent = '成功：已觸發本機檔案下載';
        downloadResult.className = 'ok';
      } catch (error) {
        downloadResult.textContent = `失敗：${error.message}`;
        downloadResult.className = 'fail';
      }
    });
  </script>
</body>
</html>
